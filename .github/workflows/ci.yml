name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  LLM_PROVIDER: stub
  LLM_STRICT_MODE: 'false'
  LLM_API_KEY: ''
  DEEPSEEK_API_KEY: ''
  QWEN_API_KEY: ''
  DASHSCOPE_API_KEY: ''
  DATABASE_URL: ''

jobs:
  backend:
    name: Backend (Python ${{ matrix.python }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.9', '3.12']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install backend dependencies
        run: python -m pip install -e '.[dev]'
      - name: Run backend tests (PostgreSQL covered separately)
        run: python -m pytest -q --ignore=backend/tests/test_postgres_storage.py

  postgres:
    name: PostgreSQL 16 integration
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-bookworm
        env:
          POSTGRES_USER: noworrycv_test
          POSTGRES_PASSWORD: ci_test_password
          POSTGRES_DB: noworrycv_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U noworrycv_test -d noworrycv_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      TEST_DATABASE_URL: postgresql://noworrycv_test:ci_test_password@127.0.0.1:5432/noworrycv_test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install backend dependencies
        run: python -m pip install -e '.[dev]'
      - name: Verify test database connection
        run: |
          python - <<'PY'
          import os
          import psycopg

          with psycopg.connect(os.environ['TEST_DATABASE_URL']) as connection:
              assert connection.execute('SELECT 1').fetchone() == (1,)
          PY
      - name: Run PostgreSQL integration tests
        run: python -m pytest -q backend/tests/test_postgres_storage.py

  frontend:
    name: JavaScript, API types and React build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: |
          python -m pip install -e .
          npm --prefix frontend ci
      - name: Run workbench and extension JavaScript tests
        run: node --test backend/tests/js/*.cjs extension/tests/*.test.cjs
      - name: Check generated API types
        run: |
          python -m scripts.generate_openapi
          npm --prefix frontend run types
          git diff --exit-code -- frontend/src/api.generated.ts
      - name: Build React editor
        run: npm --prefix frontend run build
